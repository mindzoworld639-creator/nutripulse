    <meta name="keywords" content="NutriPulse, AI calorie counter, meal planner, Indian diet macro tracker, fitness companion, free workout generator">

     crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #1e293b;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            color: #38bdf8;
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-align: center;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-card {
            margin-top: 20px;
            padding: 16px;
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NutriPulse Pro</h1>
    <p class="subtitle">AI-Powered Meal & Fitness companion</p>
    
    <div class="form-group">
        <label for="mealInput">Log Your Meal or Food Item:</label>
        <input type="text" id="mealInput" placeholder="e.g. 2 Roti, Dal, and Paneer Curry">
    </div>
    
    <button onclick="analyzeMeal()">Analyze Nutrition</button>
    
    <div class="result-card" id="resultCard">
        <h3 style="color: #38bdf8; margin-bottom: 8px;">Estimated Breakdown</h3>
        <p id="resultText" style="color: #cbd5e1; font-size: 0.95rem; line-height: 1.5;"></p>
    </div>
</div>

<script>
    function analyzeMeal() {
        const input = document.getElementById('mealInput').value;
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');
        
        if(!input.trim()) {
            alert('Please enter a meal to analyze.');
            return;
        }
        
        resultText.innerHTML = '<strong>Analyzing...</strong> Calculating macros and calorie estimates for "' + input + '"...';
        resultCard.style.display = 'block';
        
        setTimeout(() => {
            resultText.innerHTML = '<strong>Meal:</strong> ' + input + '<br><br>' +
                '🔥 <strong>Calories:</strong> ~450 - 520 kcal<br>' +
                '💪 <strong>Protein:</strong> 18g<br>' +
                '🌾 <strong>Carbs:</strong> 62g<br>' +
                '🥑 <strong>Fats:</strong> 14g<br><br>' +
                '<em>Tip: Pair with a side salad to improve fiber intake!</em>';
        }, 1200);
    }
</script>

</body>
</html>
